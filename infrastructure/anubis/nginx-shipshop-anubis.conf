# À fusionner dans le server { listen 443 ... } de shipshop.klambocore.com
# Remplace le seul `location / { proxy_pass http://127.0.0.1:3000; ... }`
#
# Avant activation : sauvegarder la conf actuelle
#   sudo cp /etc/nginx/sites-available/shipshop /etc/nginx/sites-available/shipshop.bak.$(date +%F)

upstream shipshop_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream shipshop_anubis {
    server 127.0.0.1:8923;
    keepalive 16;
}

# Mobile + API web : JAMAIS Anubis (Bearer / CORS / rate-limit Postgres)
location /api/ {
    proxy_pass http://shipshop_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 12m;
}

location /uploads/ {
    proxy_pass http://shipshop_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /_next/static/ {
    proxy_pass http://shipshop_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public";
}

# Pages HTML web → Anubis → Node
location / {
    proxy_pass http://shipshop_anubis;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
