# Snippet Nginx staging — Anubis devant le HTML, API directe vers Node.
# Ne pas activer en production sans tests cookies Better Auth + uploads + LiveKit.
#
# Schéma :
#   :443 → Nginx
#     /api/  /uploads/  → http://127.0.0.1:3000   (sécurité = shop/src/lib/security)
#     /                 → http://127.0.0.1:8923   (Anubis → upstream Node :3000)

upstream shipshop_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream shipshop_anubis {
    server 127.0.0.1:8923;
    keepalive 16;
}

# --- API + uploads : PAS de challenge Anubis (mobile + web app) ---
location /api/ {
    proxy_pass http://shipshop_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 12m;
}

location /uploads/ {
    proxy_pass http://shipshop_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Next static / image optimization (souvent hors challenge)
location /_next/static/ {
    proxy_pass http://shipshop_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public";
}

# HTML et reste → Anubis
location / {
    proxy_pass http://shipshop_anubis;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# Retour arrière : remplacer proxy_pass Anubis par shipshop_node dans location /.
