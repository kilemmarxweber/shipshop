# CI unitaire — auth security + idempotence transferts (sans Playwright navigateur)
name: Unit security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: unit-security-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  unit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version lue depuis package.json#packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Unit tests (auth + transfer idempotency + cinetpay)
        run: pnpm run test:unit

      - name: Newman health checks (sans secret)
        if: vars.SHIPSHOP_API_URL != ''
        run: pnpm dlx newman run postman/ShipShop-API.postman_collection.json --folder Monitoring --env-var baseUrl=${{ vars.SHIPSHOP_API_URL }}
