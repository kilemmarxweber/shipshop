# CI unitaire — auth security + idempotence transferts (sans Playwright navigateur)
name: Unit security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: unit-security-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  unit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Unit tests (auth + transfer idempotency + cinetpay)
        run: npm run test:unit
