services:
  postgres:
    image: postgres:16-alpine
    container_name: chipshop-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: chipshop
      POSTGRES_PASSWORD: chipshop
      POSTGRES_DB: chipshop
    volumes:
      - chipshop_pgdata:/var/lib/postgresql/data

volumes:
  chipshop_pgdata:
